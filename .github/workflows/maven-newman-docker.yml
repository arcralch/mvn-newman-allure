# Workflow de CI usando Docker autosuficiente
# Ejecuta TODAS las pruebas dentro del contenedor Docker.
# La imagen ya incluye: Newman, Maven.

name: Run Tests (Docker)

on:
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t maven-newman-tests .

      - name: Run tests and generate Allure report
        run: docker run --name temp-container maven-newman-tests

      - name: Extract Allure results from container
        run: |
          docker cp temp-container:/app/target/allure-results ./target/allure-results
          docker cp temp-container:/app/target/allure-report ./target/allure-report
          docker rm temp-container

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 30

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report/
          retention-days: 30